[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cockpit-jax"
version = "0.1.0"
description = "Unofficial partial JAX implementation of Cockpit, with checkpoint replay for failure analysis"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["flax", "optax", "orbax-checkpoint", "numpy", "matplotlib"]

[project.urls]
Homepage = "https://github.com/madyarc/cockpit-jax"

[tool.setuptools]
packages = ["cockpit_jax"]
